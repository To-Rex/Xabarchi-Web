<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xabarchi — o'z Android telefoningiz orqali SMS yuboring. Biznesingiz uchun qulay, arzon va ishonchli SMS platformasi." />
    <meta name="theme-color" content="#0E9488" />
    <meta property="og:title" content="Xabarchi — SMS platformasi" />
    <meta property="og:description" content="O'z Android telefoningiz orqali SMS yuboring. Aggregatorlarsiz, o'z SIM-kartangiz bilan." />
    <meta property="og:type" content="website" />
    <title>Xabarchi — SMS platformasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('xabarchi:theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
